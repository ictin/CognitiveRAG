name: PFSCE NECF Live Pre-Cutoff Capture

on:
  schedule:
    # Redundant pre-cutoff attempts. The capture script accepts only 09:50-10:24
    # America/New_York and stores each accepted attempt append-only. Both UTC
    # families are scheduled so DST/standard-time transitions remain safe.
    - cron: '55 13 * * *'
    - cron: '05 14 * * *'
    - cron: '15 14 * * *'
    - cron: '55 14 * * *'
    - cron: '05 15 * * *'
    - cron: '15 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pfsce-necf-live-precutoff-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen experiment branch
        uses: actions/checkout@v4
        with:
          ref: pfsce-necf-confirmatory-2024-run-20260819
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install transport dependencies
        run: python -m pip install --quiet requests boto3

      - name: Capture canonical EIA and NOAA availability before cutoff
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python experiments/pfsce_v8_2_prospective/capture_live_inputs.py

      - name: Commit immutable capture if one was produced
        run: |
          if git status --porcelain experiments/pfsce_v8_2_prospective/necf_precutoff/ | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add experiments/pfsce_v8_2_prospective/necf_precutoff/
            git commit -m "Freeze NECF pre-cutoff source capture $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:pfsce-necf-confirmatory-2024-run-20260819
          else
            echo 'No in-window capture produced.'
          fi
