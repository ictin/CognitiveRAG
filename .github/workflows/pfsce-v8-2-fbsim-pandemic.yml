name: PFSCE v8.2 ForecastBench-Sim Pandemic Validation

on:
  pull_request:
    branches: [master]
    paths:
      - "experiments/pfsce_v8_2_cross_domain/TRIGGER_FBSIM_PANDEMIC_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout PFSCE validation branch
        uses: actions/checkout@v4
        with:
          ref: pfsce-necf-confirmatory-2024-run-20260819

      - name: Verify frozen controlled-world protocol
        run: |
          test -f experiments/pfsce_v8_2_cross_domain/FORECASTBENCH_SIM_PANDEMIC_FREEZE.md
          sha256sum experiments/pfsce_v8_2_cross_domain/FORECASTBENCH_SIM_PANDEMIC_FREEZE.md | tee FBSIM_PROTOCOL_SHA256.txt
          sed -n '1,280p' experiments/pfsce_v8_2_cross_domain/FORECASTBENCH_SIM_PANDEMIC_FREEZE.md

      - name: Checkout pinned ForecastBench-Sim source
        run: |
          git clone https://github.com/forecastingresearch/forecastbench-sim.git forecastbench-sim
          cd forecastbench-sim
          git checkout a5b446cdbe6302302bed51616d0ced3b3f5239ed
          git rev-parse HEAD | tee ../FBSIM_SOURCE_COMMIT.txt
          cd ..

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark and validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./forecastbench-sim/packages/fbsim-core -e ./forecastbench-sim/worlds/pandemic
          pip install "pandas>=2.2" "scikit-learn>=1.5"

      - name: Execute frozen controlled-world holdout
        run: |
          python experiments/pfsce_v8_2_cross_domain/run_forecastbench_sim_pandemic_v1.py \
            --fbsim-repo forecastbench-sim \
            --out-dir experiment_output/fbsim_pandemic_v1
          cp FBSIM_SOURCE_COMMIT.txt experiment_output/fbsim_pandemic_v1/
          cp FBSIM_PROTOCOL_SHA256.txt experiment_output/fbsim_pandemic_v1/
          find experiment_output/fbsim_pandemic_v1 -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > experiment_output/fbsim_pandemic_v1/SHA256SUMS.txt

      - name: Upload immutable controlled-world evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfsce-v8-2-fbsim-pandemic-v1
          path: experiment_output/fbsim_pandemic_v1
          if-no-files-found: warn
          retention-days: 90
