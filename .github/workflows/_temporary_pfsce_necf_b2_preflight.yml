name: Temporary PFSCE NECF B2 HRRR Preflight

on:
  pull_request:
    branches:
      - master
    paths:
      - experiments/pfsce_necf_confirmatory_2024/run_b2_preflight.py
      - experiments/pfsce_necf_confirmatory_2024/B2_SOURCE_ADAPTER_FREEZE.md

permissions:
  contents: write

jobs:
  b2-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pfsce-necf-confirmatory-2024-run-20260819
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preflight dependencies
        run: python -m pip install --upgrade pip pandas numpy boto3 botocore numcodecs pyproj
      - name: Execute HRRR point-in-time source-adapter preflight
        run: python experiments/pfsce_necf_confirmatory_2024/run_b2_preflight.py
      - name: Freeze preflight result on experiment branch
        if: success()
        run: |
          mkdir -p experiments/pfsce_necf_confirmatory_2024/results
          cp experiment_output/B2_HRRR_PREFLIGHT.json experiments/pfsce_necf_confirmatory_2024/results/B2_HRRR_PREFLIGHT.json
          sha256sum experiments/pfsce_necf_confirmatory_2024/results/B2_HRRR_PREFLIGHT.json > experiments/pfsce_necf_confirmatory_2024/results/B2_HRRR_PREFLIGHT_SHA256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/pfsce_necf_confirmatory_2024/results/B2_HRRR_PREFLIGHT.json experiments/pfsce_necf_confirmatory_2024/results/B2_HRRR_PREFLIGHT_SHA256.txt
          git commit -m 'Freeze B2 HRRR source-adapter preflight'
          git push origin HEAD:pfsce-necf-confirmatory-2024-run-20260819
      - name: Upload preflight output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfsce-necf-b2-hrrr-preflight
          path: experiment_output/
          if-no-files-found: warn
          retention-days: 90
