name: PFSCE NECF B1 2025 Replication

on:
  pull_request:
    branches:
      - master
    paths:
      - "experiments/pfsce_necf_confirmatory_2024/run_replication_2025_b1.py"
      - ".github/workflows/pfsce-necf-replication-2025-b1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replicate-b1-2025:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: pfsce-necf-confirmatory-2024-run-20260819

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen runner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "pandas>=2.2" "scipy>=1.12" "scikit-learn>=1.5" "requests>=2.32" tzdata

      - name: Confirm 2025 replication contract exists
        run: |
          test -f experiments/pfsce_necf_confirmatory_2024/REPLICATION_2025_FREEZE.md
          sha256sum experiments/pfsce_necf_confirmatory_2024/REPLICATION_2025_FREEZE.md
          sed -n '1,160p' experiments/pfsce_necf_confirmatory_2024/REPLICATION_2025_FREEZE.md

      - name: Run B1 2025 replication
        run: |
          python experiments/pfsce_necf_confirmatory_2024/run_replication_2025_b1.py

      - name: Freeze compact B1 replication result on experiment branch
        if: success()
        run: |
          DEST=experiments/pfsce_necf_confirmatory_2024/results/replication_2025
          mkdir -p "$DEST"
          cp experiment_output/replication_2025/B1_2025_REPLICATION.json "$DEST/B1_2025_REPLICATION.json"
          cp experiment_output/replication_2025/B1_2025_REPLICATION_VERDICT.md "$DEST/B1_2025_REPLICATION_VERDICT.md"
          cp experiment_output/replication_2025/B1_2025_source_provenance.json "$DEST/B1_2025_source_provenance.json"
          cp experiment_output/replication_2025/B1_2025_SHA256.json "$DEST/B1_2025_SHA256.json"
          sha256sum "$DEST"/* > "$DEST/SHA256SUMS.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Freeze PFSCE NECF B1 2025 replication result'
            git push origin HEAD:pfsce-necf-confirmatory-2024-run-20260819
          fi

      - name: Remove large raw archives before artifact upload
        if: always()
        run: |
          rm -rf experiment_output/raw experiment_output/replication_2025/raw || true

      - name: Upload immutable B1 replication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfsce-necf-b1-2025-replication
          path: experiment_output/replication_2025
          if-no-files-found: warn
          retention-days: 90
