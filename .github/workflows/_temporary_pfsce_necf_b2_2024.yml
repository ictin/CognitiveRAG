name: Temporary PFSCE NECF B2 2024 Validation

on:
  pull_request:
    branches:
      - master
    paths:
      - experiments/pfsce_necf_confirmatory_2024/run_b2.py
      - .github/workflows/pfsce-necf-confirmatory-2024-b2.yml

permissions:
  contents: write

jobs:
  weather:
    strategy:
      fail-fast: false
      matrix:
        year: [2020, 2021, 2022, 2023, 2024]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pfsce-necf-confirmatory-2024-run-20260819
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install weather extraction dependencies
        run: python -m pip install --upgrade pip pandas numpy boto3 botocore numcodecs pyproj
      - name: Extract fixed HRRR weather shard
        shell: bash
        run: |
          START="${{ matrix.year }}-01-01"
          if [ "${{ matrix.year }}" = "2020" ]; then START="2019-12-31"; fi
          python experiments/pfsce_necf_confirmatory_2024/run_b2.py extract-weather \
            --start "$START" --end "${{ matrix.year }}-12-31" \
            --out "experiment_output/weather_${{ matrix.year }}.csv" \
            --manifest "experiment_output/weather_${{ matrix.year }}_manifest.json"
      - name: Upload weather shard
        uses: actions/upload-artifact@v4
        with:
          name: weather-${{ matrix.year }}
          path: experiment_output/
          retention-days: 90

  score:
    needs: weather
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pfsce-necf-confirmatory-2024-run-20260819
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scoring dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy scikit-learn requests
      - name: Download frozen weather shards
        uses: actions/download-artifact@v4
        with:
          pattern: weather-*
          path: weather_parts
          merge-multiple: true
      - name: Execute B2 2024 confirmatory score
        run: python experiments/pfsce_necf_confirmatory_2024/run_b2.py score --weather-dir weather_parts --out-dir experiment_output
      - name: Freeze compact B2 result on experiment branch
        if: success()
        run: |
          mkdir -p experiments/pfsce_necf_confirmatory_2024/results
          cp experiment_output/B2_2024.json experiments/pfsce_necf_confirmatory_2024/results/B2_2024.json
          cp experiment_output/B2_2024_VERDICT.md experiments/pfsce_necf_confirmatory_2024/results/B2_2024_VERDICT.md
          cp experiment_output/B2_WEATHER_PROVENANCE_SUMMARY.json experiments/pfsce_necf_confirmatory_2024/results/B2_WEATHER_PROVENANCE_SUMMARY.json
          sha256sum experiments/pfsce_necf_confirmatory_2024/results/B2_2024.json experiments/pfsce_necf_confirmatory_2024/results/B2_2024_VERDICT.md experiments/pfsce_necf_confirmatory_2024/results/B2_WEATHER_PROVENANCE_SUMMARY.json > experiments/pfsce_necf_confirmatory_2024/results/B2_SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/pfsce_necf_confirmatory_2024/results/B2_2024.json experiments/pfsce_necf_confirmatory_2024/results/B2_2024_VERDICT.md experiments/pfsce_necf_confirmatory_2024/results/B2_WEATHER_PROVENANCE_SUMMARY.json experiments/pfsce_necf_confirmatory_2024/results/B2_SHA256SUMS.txt
          git commit -m 'Freeze PFSCE NECF B2 2024 confirmatory result'
          git push origin HEAD:pfsce-necf-confirmatory-2024-run-20260819
      - name: Upload B2 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfsce-necf-b2-2024-confirmatory
          path: experiment_output/
          if-no-files-found: warn
          retention-days: 90
