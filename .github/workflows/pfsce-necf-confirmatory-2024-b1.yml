name: PFSCE NECF 2024 B1 Confirmatory

on:
  push:
    branches:
      - pfsce-necf-confirmatory-2024-run-20260819
    paths:
      - .github/workflows/pfsce-necf-confirmatory-2024-b1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmatory-b1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen runner dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy scikit-learn requests
      - name: Execute B1 2024 confirmatory holdout
        run: python experiments/pfsce_necf_confirmatory_2024/run_b1.py
      - name: Hash result artifacts
        if: always()
        run: |
          if [ -d experiment_output ]; then find experiment_output -type f -maxdepth 2 -print0 | sort -z | xargs -0 sha256sum | tee experiment_output/SHA256SUMS.txt; fi
      - name: Upload immutable experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfsce-necf-b1-2024-confirmatory
          path: experiment_output/
          if-no-files-found: warn
          retention-days: 90
