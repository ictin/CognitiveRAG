name: PFSCE v8.2 FluSight Cross-Domain Validation

on:
  pull_request:
    branches: [master]
    paths:
      - "experiments/pfsce_v8_2_cross_domain/TRIGGER_FLUSIGHT_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout PFSCE validation branch
        uses: actions/checkout@v4
        with:
          ref: pfsce-necf-confirmatory-2024-run-20260819

      - name: Verify protocol freeze before external holdout checkout
        run: |
          test -f experiments/pfsce_v8_2_cross_domain/FLUSIGHT_RESIDUAL_VALIDATION_FREEZE.md
          sha256sum experiments/pfsce_v8_2_cross_domain/FLUSIGHT_RESIDUAL_VALIDATION_FREEZE.md | tee FLUSIGHT_PROTOCOL_SHA256.txt
          sed -n '1,240p' experiments/pfsce_v8_2_cross_domain/FLUSIGHT_RESIDUAL_VALIDATION_FREEZE.md

      - name: Checkout immutable snapshot of official CDC FluSight hub
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/cdcepi/FluSight-forecast-hub.git flusight
          cd flusight
          git sparse-checkout init --no-cone
          printf '%s\n' '/model-output/FluSight-ensemble/' '/target-data/target-hospital-admissions.csv' > .git/info/sparse-checkout
          git checkout main
          git rev-parse HEAD | tee ../FLUSIGHT_SOURCE_COMMIT.txt
          cd ..
          test -d flusight/model-output/FluSight-ensemble
          test -f flusight/target-data/target-hospital-admissions.csv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scoring dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "pandas>=2.2" "scikit-learn>=1.5" tzdata

      - name: Execute frozen cross-domain holdout
        run: |
          python experiments/pfsce_v8_2_cross_domain/run_flusight_residual_v1.py \
            --flusight-repo flusight \
            --out-dir experiment_output/flusight_v1
          cp FLUSIGHT_SOURCE_COMMIT.txt experiment_output/flusight_v1/
          cp FLUSIGHT_PROTOCOL_SHA256.txt experiment_output/flusight_v1/
          find experiment_output/flusight_v1 -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > experiment_output/flusight_v1/SHA256SUMS.txt

      - name: Upload immutable validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfsce-v8-2-flusight-cross-domain-v1
          path: experiment_output/flusight_v1
          if-no-files-found: warn
          retention-days: 90
