name: PFSCE EIA Secret Smoke Test

# Manual-only by user request. Do not add automatic triggers or run this
# workflow without the user's explicit approval for the specific GitHub Actions run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check EIA secret presence and API connectivity
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EIA_API_KEY:-}" ]; then
            echo "EIA_API_KEY_MISSING"
            exit 2
          fi
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          key = os.environ['EIA_API_KEY']
          url = 'https://api.eia.gov/v2/electricity/rto/region-data/?' + urllib.parse.urlencode({'api_key': key})
          req = urllib.request.Request(url, headers={'User-Agent':'PFSCE-v8.2-secret-smoke/1.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              raw = r.read()
              status = r.status
          obj = json.loads(raw)
          if status != 200 or 'response' not in obj:
              raise SystemExit('EIA_API_CONNECTIVITY_OR_AUTH_FAILED')
          print('EIA_API_KEY_PRESENT_AND_CONNECTIVITY_OK')
          print('HTTP_STATUS', status)
          print('RESPONSE_KEYS', sorted(obj.get('response', {}).keys()))
          PY
