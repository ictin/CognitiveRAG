name: PFSCE NECF B1 2024 Confirmatory

on:
  push:
    branches:
      - pfsce-necf-confirmatory-2024-run-20260819
    paths:
      - "validation/pfsce_necf/**"
      - ".github/workflows/pfsce_necf_b1_2024.yml"
  pull_request:
    branches:
      - master
    paths:
      - "validation/pfsce_necf/**"
      - ".github/workflows/pfsce_necf_b1_2024.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b1-confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "pandas>=2.2" "scipy>=1.12" "scikit-learn>=1.5" "requests>=2.32" "pyarrow>=16.0" tzdata

      - name: Verify frozen protocol reference
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('validation/pfsce_necf/preregistration.yaml')
          print('preregistration_sha256=', hashlib.sha256(p.read_bytes()).hexdigest())
          print(p.read_text()[:1000])
          PY

      - name: Run B1 2024 confirmatory holdout only
        env:
          PFSCE_OUT: validation/pfsce_necf/results/2024_b1
        run: |
          python validation/pfsce_necf/run_b1_confirmatory_2024.py

      - name: Remove large source archive before artifact upload
        if: always()
        run: rm -f validation/pfsce_necf/results/2024_b1/EBA.zip

      - name: Build artifact checksums
        if: always()
        run: |
          if [ -d validation/pfsce_necf/results/2024_b1 ]; then
            find validation/pfsce_necf/results/2024_b1 -type f -print0 | sort -z | xargs -0 sha256sum > validation/pfsce_necf/results/2024_b1/SHA256SUMS.txt || true
          fi

      - name: Upload confirmatory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfsce-necf-b1-2024-confirmatory
          path: validation/pfsce_necf/results/2024_b1
          if-no-files-found: warn
          retention-days: 90
