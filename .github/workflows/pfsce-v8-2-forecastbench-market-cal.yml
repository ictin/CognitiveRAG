name: PFSCE v8.2 ForecastBench Market Calibration

on:
  pull_request:
    branches: [master]
    paths:
      - "experiments/pfsce_v8_2_cross_domain/TRIGGER_FORECASTBENCH_MARKET_CAL_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout PFSCE validation branch
        uses: actions/checkout@v4
        with:
          ref: pfsce-necf-confirmatory-2024-run-20260819

      - name: Verify frozen broad-calibration protocol before external holdout materialization
        run: |
          test -f experiments/pfsce_v8_2_cross_domain/FORECASTBENCH_MARKET_CALIBRATION_FREEZE.md
          sha256sum experiments/pfsce_v8_2_cross_domain/FORECASTBENCH_MARKET_CALIBRATION_FREEZE.md | tee FORECASTBENCH_MARKET_CAL_PROTOCOL_SHA256.txt
          sed -n '1,320p' experiments/pfsce_v8_2_cross_domain/FORECASTBENCH_MARKET_CALIBRATION_FREEZE.md

      - name: Checkout pinned ForecastBench datasets with LFS
        run: |
          git lfs version
          GIT_LFS_SKIP_SMUDGE=1 git clone --filter=blob:none --no-checkout https://github.com/forecastingresearch/forecastbench-datasets.git forecastbench-datasets
          cd forecastbench-datasets
          git sparse-checkout init --cone
          git sparse-checkout set datasets/question_sets datasets/resolution_sets
          GIT_LFS_SKIP_SMUDGE=1 git checkout 638d1e6808a0aa352851949bea62918fb55ca054
          git rev-parse HEAD | tee ../FORECASTBENCH_DATASET_COMMIT.txt
          git lfs pull --include="datasets/question_sets/*-llm.json,datasets/resolution_sets/*_resolution_set.json"
          cd ..

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "pandas>=2.2" "scikit-learn>=1.5"

      - name: Execute frozen broad real-world holdout
        run: |
          python experiments/pfsce_v8_2_cross_domain/run_forecastbench_market_calibration_v1.py \
            --dataset-repo forecastbench-datasets \
            --out-dir experiment_output/forecastbench_market_cal_v1
          cp FORECASTBENCH_DATASET_COMMIT.txt experiment_output/forecastbench_market_cal_v1/
          cp FORECASTBENCH_MARKET_CAL_PROTOCOL_SHA256.txt experiment_output/forecastbench_market_cal_v1/
          find experiment_output/forecastbench_market_cal_v1 -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > experiment_output/forecastbench_market_cal_v1/SHA256SUMS.txt

      - name: Upload immutable broad-calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfsce-v8-2-forecastbench-market-cal-v1
          path: experiment_output/forecastbench_market_cal_v1
          if-no-files-found: warn
          retention-days: 90
