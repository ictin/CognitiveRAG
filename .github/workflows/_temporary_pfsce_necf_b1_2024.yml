name: Temporary PFSCE NECF B1 2024 Validation

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/_temporary_pfsce_necf_b1_2024.yml
  pull_request:
    branches:
      - master
    paths:
      - experiments/pfsce_necf_confirmatory_2024/run_b1.py
      - .github/workflows/pfsce-necf-confirmatory-2024-b1.yml

permissions:
  contents: write

jobs:
  confirmatory-b1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pfsce-necf-confirmatory-2024-run-20260819
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen runner dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy scikit-learn requests
      - name: Execute B1 2024 confirmatory holdout
        run: python experiments/pfsce_necf_confirmatory_2024/run_b1.py
      - name: Freeze compact result on experiment branch
        if: success()
        run: |
          mkdir -p experiments/pfsce_necf_confirmatory_2024/results
          cp experiment_output/B1_2024.json experiments/pfsce_necf_confirmatory_2024/results/B1_2024.json
          cp experiment_output/source_provenance.json experiments/pfsce_necf_confirmatory_2024/results/B1_2024_source_provenance.json
          sha256sum experiments/pfsce_necf_confirmatory_2024/results/B1_2024.json experiments/pfsce_necf_confirmatory_2024/results/B1_2024_source_provenance.json > experiments/pfsce_necf_confirmatory_2024/results/SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/pfsce_necf_confirmatory_2024/results
          git commit -m 'Freeze PFSCE NECF B1 2024 confirmatory result'
          git push origin HEAD:pfsce-necf-confirmatory-2024-run-20260819
      - name: Upload experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfsce-necf-b1-2024-confirmatory
          path: experiment_output/
          if-no-files-found: warn
          retention-days: 90
